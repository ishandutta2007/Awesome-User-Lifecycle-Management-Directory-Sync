<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Line Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b224ef" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7579ff" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
    .node-pulse {
      animation: pulseAnim 3s ease-in-out infinite alternate;
    }
    @keyframes pulseAnim {
      0% { r: 5; opacity: 0.4; }
      100% { r: 9; opacity: 0.95; }
    }
    .flow-line {
      stroke-dasharray: 8, 12;
      animation: flowAnim 25s linear infinite;
    }
    @keyframes flowAnim {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    .orbit-particle {
      animation: orbitMove 12s linear infinite;
    }
    @keyframes orbitMove {
      0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
    }
    .sync-spin {
      transform-origin: 600px 75px;
      animation: spinSync 20s linear infinite;
    }
    @keyframes spinSync {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .badge-card {
      transition: all 0.3s ease;
    }
    .badge-card:hover {
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.5));
    }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Architecture -->
  <g class="grid-layer">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Dynamic / Animated Identity Flow Lines -->
  <path d="M-50,220 C250,140 400,280 650,200 C850,130 1000,240 1250,180" fill="none" stroke="url(#cyberCyan)" stroke-width="2.5" class="flow-line" opacity="0.65" />
  <path d="M-50,140 C200,240 450,100 700,220 C950,310 1100,120 1250,160" fill="none" stroke="url(#neonPurple)" stroke-width="2" class="flow-line" opacity="0.5" />

  <!-- Background Animated Network Nodes -->
  <g filter="url(#glowCyan)">
    <circle cx="150" cy="180" r="6" fill="#00f2fe" class="node-pulse" />
    <circle cx="300" cy="240" r="5" fill="#38bdf8" class="node-pulse" style="animation-delay: 0.8s;" />
    <circle cx="450" cy="120" r="7" fill="#818cf8" class="node-pulse" style="animation-delay: 1.5s;" />
    <circle cx="750" cy="240" r="6" fill="#38bdf8" class="node-pulse" style="animation-delay: 0.5s;" />
    <circle cx="900" cy="120" r="7" fill="#00f2fe" class="node-pulse" style="animation-delay: 2.1s;" />
    <circle cx="1050" cy="200" r="5" fill="#c084fc" class="node-pulse" style="animation-delay: 1.1s;" />
  </g>

  <!-- Central Decorative Header Sync Rings (Subtle spin in background) -->
  <g class="sync-spin" opacity="0.4" filter="url(#glowCyan)">
    <circle cx="600" cy="75" r="48" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6, 8" />
    <circle cx="600" cy="75" r="32" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4, 6" />
    <circle cx="645" cy="75" r="4" fill="#38bdf8" />
    <circle cx="555" cy="75" r="4" fill="#00f2fe" />
  </g>

  <!-- FOREGROUND CONTENT: Header Icon, Title, and Subtitle -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Icon Backdrop Badge -->
    <rect x="-30" y="-30" width="60" height="60" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)" />
    <!-- User Lifecycle & Directory Sync Glyph -->
    <path d="M-10,-8 A10,10 0 1,0 10,-8 A10,10 0 1,0 -10,-8 M-18,16 C-18,6 18,6 18,16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M-14,0 L-20,0 M14,0 L20,0 M0,-14 L0,-20 M0,16 L0,20" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Title & Subtitle (High contrast foreground, protected from overlapping elements) -->
  <text x="600" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="1" fill="url(#titleGrad)" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
    AWESOME USER LIFECYCLE MANAGEMENT &amp; DIRECTORY SYNC
  </text>

  <text x="600" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="15.5" fill="#94a3b8" letter-spacing="0.5">
    The Curated Directory of Joiner-Mover-Leaver (JML) Workflows, SCIM 2.0 Provisioning &amp; Enterprise Identity Governance
  </text>

  <!-- Interactive / Floating Workflow Concept Pills -->
  <g transform="translate(600, 245)">
    <!-- Pill 1: SCIM 2.0 & RFC 7644 -->
    <g transform="translate(-460, 0)" class="badge-card">
      <rect x="0" y="0" width="210" height="52" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="26" cy="26" r="10" fill="#0369a1" />
      <text x="26" y="30" font-family="sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">⇄</text>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">SCIM 2.0 Sync</text>
      <text x="50" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">RFC 7643 &amp; 7644</text>
    </g>

    <!-- Pill 2: JML Workflows -->
    <g transform="translate(-230, 0)" class="badge-card">
      <rect x="0" y="0" width="210" height="52" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="26" cy="26" r="10" fill="#4338ca" />
      <text x="26" y="30" font-family="sans-serif" font-size="12" fill="#a5b4fc" text-anchor="middle" font-weight="bold">⚡</text>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Automated JML</text>
      <text x="50" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Joiner • Mover • Leaver</text>
    </g>

    <!-- Pill 3: Enterprise Directories -->
    <g transform="translate(0, 0)" class="badge-card">
      <rect x="0" y="0" width="210" height="52" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="26" cy="26" r="10" fill="#065f46" />
      <text x="26" y="30" font-family="sans-serif" font-size="12" fill="#34d399" text-anchor="middle" font-weight="bold">🗂</text>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Directory Federation</text>
      <text x="50" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">HRIS, AD, LDAP &amp; Cloud</text>
    </g>

    <!-- Pill 4: Zero Trust & IGA Governance -->
    <g transform="translate(230, 0)" class="badge-card">
      <rect x="0" y="0" width="220" height="52" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="26" cy="26" r="10" fill="#701a75" />
      <text x="26" y="30" font-family="sans-serif" font-size="12" fill="#f472b6" text-anchor="middle" font-weight="bold">🛡</text>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Zero Trust &amp; IGA</text>
      <text x="50" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">RBAC, ABAC &amp; Least Privilege</text>
    </g>
  </g>

  <!-- Bottom Visual Anchor -->
  <line x1="300" y1="325" x2="900" y2="325" stroke="url(#cyberCyan)" stroke-width="1" opacity="0.4" />
</svg>
